<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>English Master</title>

<link href="https://fontscom/css2?family=Poppins:wght@300;400;500;600;700&display=swap

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#4f46e5,#7c3aed);
min-height:100vh;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

.glass{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);
border-radius:25px;
padding:25px;
color:white;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
outline:none;
}

button{
padding:12px 25px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:bold;
background:#fbbf24;
color:black;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
}

.hidden{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:white;
color:#4f46e5;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:20px;
}

.card{
background:white;
color:#333;
border-radius:20px;
padding:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
}

.progress{
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:70%;
background:linear-gradient(90deg,#10b981,#22c55e);
}

.word{
background:white;
padding:20px;
border-radius:15px;
margin:10px 0;
color:#333;
}

.option{
background:#f1f5f9;
padding:12px;
margin:10px 0;
border-radius:10px;
cursor:pointer;
}

.option:hover{
background:#dbeafe;
}

.score{
font-size:30px;
font-weight:bold;
text-align:center;
padding:20px;
background:white;
border-radius:15px;
color:#10b981;
}

</style>
</head>

<body>

<div class="container">

<div id="loginBox" class="glass">

<h1>📚 English Master</h1>

<h3>Đăng ký</h3>

<input id="regUser" placeholder="Tên tài khoản">

<input id="regPass" type="password" placeholder="Mật khẩu">

<button onclick="register()">Đăng ký</button>

<br><br>

<h3>Đăng nhập</h3>

<input id="loginUser" placeholder="Tên tài khoản">

<input id="loginPass" type="password" placeholder="Mật khẩu">

<button onclick="login()">Đăng nhập</button>

</div>

<div id="dashboard" class="hidden">

<div class="glass">

<div class="topbar">

<div>
<h2>Xin chào 👋</h2>
<h3 id="userName"></h3>
</div>

<div class="avatar">E</div>

</div>

<h3>🏆 Điểm cao nhất:
<span id="bestScore">0</span>
</h3>

<h3 style="margin-top:15px;">
⭐ XP Progress
</h3>

<div class="progress">
<div class="progress-bar"></div>
</div>

<div class="cards">

<div class="card">
<h3>📖 Vocabulary</h3>
<p>Học từ vựng thông dụng</p>
<br>
<button onclick="showVocabulary()">
Học ngay
</button>
</div>

<div class="card">
<h3>📝 Quiz</h3>
<p>Kiểm tra kiến thức</p>
<br>
<button onclick="startQuiz()">
Làm bài
</button>
</div>

<div class="card">
<h3>🔥 Streak</h3>
<p>15 ngày liên tiếp</p>
</div>

<div class="card">
<h3>🏅 Rank</h3>
<p>Gold Learner</p>
</div>

</div>

<br>

<button onclick="logout()">
Đăng xuất
</button>

</div>

<br>

<div id="content"></div>

</div>

</div>

<script>

let currentUser="";

const vocabulary=[
{
word:"Apple",
meaning:"Quả táo"
},
{
word:"Computer",
meaning:"Máy tính"
},
{
word:"Teacher",
meaning:"Giáo viên"
},
{
word:"School",
meaning:"Trường học"
},
{
word:"Friend",
meaning:"Bạn bè"
}
];

const questions=[
{
q:"Apple nghĩa là gì?",
a:["Máy tính","Quả táo","Con mèo","Ngôi nhà"],
correct:"Quả táo"
},
{
q:"Teacher nghĩa là gì?",
a:["Giáo viên","Bác sĩ","Học sinh","Kỹ sư"],
correct:"Giáo viên"
},
{
q:"Computer nghĩa là gì?",
a:["Máy tính","Xe máy","Điện thoại","Con chó"],
correct:"Máy tính"
}
];

function register(){

let user=document.getElementById("regUser").value;
let pass=document.getElementById("regPass").value;

if(!user || !pass){
alert("Nhập đầy đủ thông tin");
return;
}

localStorage.setItem(
"user_"+user,
JSON.stringify({
password:pass,
score:0
})
);

alert("Đăng ký thành công");
}

function login(){

let user=document.getElementById("loginUser").value;
let pass=document.getElementById("loginPass").value;

let data=localStorage.getItem("user_"+user);

if(!data){
alert("Không tồn tại tài khoản");
return;
}

data=JSON.parse(data);

if(data.password!==pass){
alert("Sai mật khẩu");
return;
}

currentUser=user;

document.getElementById("loginBox").classList.add("hidden");
document.getElementById("dashboard").classList.remove("hidden");

document.getElementById("userName").innerText=user;
document.getElementById("bestScore").innerText=data.score;

}

function logout(){

document.getElementById("dashboard").classList.add("hidden");
document.getElementById("loginBox").classList.remove("hidden");
document.getElementById("content").innerHTML="";

}

function showVocabulary(){

let html=`<div class="glass"><h2>📖 Danh sách từ vựng</h2>`;

vocabulary.forEach(v=>{

html+=`
<div class="word">
<h3>${v.word}</h3>
<p>${v.meaning}</p>
</div>
`;

});

html+="</div>";

document.getElementById("content").innerHTML=html;
}

function startQuiz(){

let html=`<div class="glass">
<h2>📝 Quiz</h2>
`;

questions.forEach((q,index)=>{

html+=`
<div class="word">
<h3>${q.q}</h3>
`;

q.a.forEach(op=>{

html+=`
<label>
<input
type="radio"
name="q${index}"
value="${op}">
${op}
</label><br><br>
`;

});

html+=`</div>`;
});

html+=`
<button onclick="finishQuiz()">
Nộp bài
</button>
</div>
`;

document.getElementById("content").innerHTML=html;
}

function finishQuiz(){

let score=0;

questions.forEach((q,index)=>{

let ans=document.querySelector(
`input[name='q${index}'\]:checked`
);

if(ans && ans.value===q.correct){
score++;
}

});

let user=JSON.parse(
localStorage.getItem("user_"+currentUser)
);

if(score>user.score){
user.score=score;

localStorage.setItem(
"user_"+currentUser,
JSON.stringify(user)
);
}

document.getElementById("bestScore").innerText=user.score;

document.getElementById("content").innerHTML=
`
<div class="glass">
<div class="score">
🎉 ${score}/${questions.length}
</div>
</div>
`;

}

</script>

</body>
</html>
 
</body>
</html>
